version: '3.8'

services:
  # PostgreSQL database for backend
  postgres:
    image: postgres:16-alpine
    container_name: nyaya_postgres
    environment:
      POSTGRES_DB: nyaya
      POSTGRES_USER: nyaya
      POSTGRES_PASSWORD: nyaya
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyaya -d nyaya"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nyaya_network

  # Qdrant vector database for AI retrieval
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nyaya_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    environment:
      QDRANT_API_KEY: ""  # Set if you want authentication
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nyaya_network

  # FastAPI backend (includes AI package as part of the same codebase)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nyaya_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://nyaya:nyaya@postgres:5432/nyaya
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - nyaya_network
    command: >
      sh -c "
      echo 'Running database migrations...' &&
      alembic upgrade head &&
      echo 'Starting FastAPI server...' &&
      uvicorn backend.main:app --host 0.0.0.0 --port 8000
      "

volumes:
  postgres_data:
  qdrant_data:

networks:
  nyaya_network:
    driver: bridge
