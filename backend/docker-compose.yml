services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nyaya
      POSTGRES_USER: nyaya
      POSTGRES_PASSWORD: nyaya
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyaya -d nyaya"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://nyaya:nyaya@db:5432/nyaya
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
